        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return [];

            const headers = lines[0].split(',').map(h => h.trim());
            const result = [];

            for (let i = 1; i < lines.length; i++) {
                // 쉼표 안에 쉼표가 있는 경우를 처리하기 위한 간단한 정규식 분리 (따옴표 고려)
                const currentLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const obj = {};
                
                // 데이터 파싱 및 가공 (목업 데이터 구조로 변환)
                const rawRow = {};
                headers.forEach((header, index) => {
                    let val = currentLine[index] ? currentLine[index].trim() : '';
                    // 따옴표 제거
                    if (val.startsWith('"') && val.endsWith('"')) {
                        val = val.substring(1, val.length - 1);
                    }
                    rawRow[header] = val;
                });

                // --- 1. 기본 정보 ---
                if (!rawRow['업체명']) continue; // 업체명이 없으면 건너뜀
                obj['업체명'] = rawRow['업체명'];
                obj['매장_요약'] = rawRow['매장_요약'] || '';
                obj['업데이트일'] = rawRow['업데이트일'] || '';
                obj['특이사항'] = rawRow['특이사항'] || '';

                // --- 2. 사진 목록 (구글 드라이브 ID 리스트) ---
                obj['매장사진_목록'] = rawRow['매장사진_목록'] ? rawRow['매장사진_목록'].split(',').map(s => s.trim()) : [];
                obj['이벤트사진_목록'] = rawRow['이벤트사진_목록'] ? rawRow['이벤트사진_목록'].split(',').map(s => s.trim()) : [];

                // --- 3. 주요 전략 (최대 3개 가정) ---
                obj['주요전략'] = [];
                for(let j=1; j<=3; j++) {
                    if(rawRow[`전략${j}_제목`]) {
                        obj['주요전략'].push({
                            icon: "fa-lightbulb", // 기본 아이콘 설정
                            title: rawRow[`전략${j}_제목`],
                            desc: rawRow[`전략${j}_내용`] || ''
                        });
                    }
                }

                // --- 4. 채널 데이터 (SNS_ 접두어 기반) ---
                obj['채널데이터'] = [];
                const channelNames = ['네이버플레이스', '인스타그램', '네이버블로그', '스마트스토어', '당근마켓', '카카오채널'];
                const channelIcons = {
                    '네이버플레이스': 'fa-map-location-dot', '인스타그램': 'fa-instagram', '네이버블로그': 'fa-blogger-b',
                    '스마트스토어': 'fa-store', '당근마켓': 'fa-carrot', '카카오채널': 'fa-comment'
                };
                const channelColors = {
                    '네이버플레이스': 'text-blue-600', '인스타그램': 'text-pink-600', '네이버블로그': 'text-green-600',
                    '스마트스토어': 'text-green-500', '당근마켓': 'text-orange-600', '카카오채널': 'text-yellow-400'
                };

                channelNames.forEach(cName => {
                    // 유무 열이 존재하거나 값이 있으면 채널 데이터 추가
                    if (rawRow[`SNS_${cName}_유무`] !== undefined) {
                        obj['채널데이터'].push({
                            "채널명": cName,
                            "아이콘": channelIcons[cName] || "fa-hashtag",
                            "색상": channelColors[cName] || "text-slate-600",
                            "유무": rawRow[`SNS_${cName}_유무`] || 'X',
                            "관리상태": rawRow[`SNS_${cName}_상태`] || '-',
                            "차별점": rawRow[`SNS_${cName}_차별점`] || '',
                            "비고": rawRow[`SNS_${cName}_비고`] || ''
                        });
                    }
                });

                result.push(obj);
            }
            return result;
        }
